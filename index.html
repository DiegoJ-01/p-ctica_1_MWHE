<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombre provisional · Tu bar de siempre, pero no como siempre</title>
    <meta name="description" content="Otra Ronda, bar de barrio en Madrid: cañas, tapas, vermut y buen rollo. Carta, novedades, horario y cómo llegar.">


    <!-- CSS de librerías -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- Tailwind desde el Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        /* Modo oscuro con la clase .dark en <html> (la pone js/interfaz.js) */
        @custom-variant dark (&:where(.dark, .dark *));
    </style>
</head>
<body>

    <!-- CABECERA -->
    <header>
    </header>

    <main id="contenido">
        <!-- 00 · PORTADA -->
        <section id="inicio"></section>

        <!-- 01 · EL BAR -->
        <section id="bar"></section>

        <!-- 02 · LA CARTA -->
        <section id="carta"></section>

        <!-- 03 · NOVEDADES -->
        <section id="novedades"></section>

        <!-- 04 · HORARIO Y CONTACTO -->
        <section id="contacto"></section>
    </main>

    <!-- FOOTER -->
    <footer>
    </footer>

    <!-- JS de librerías -->
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="js/interfaz.js"></script>
    <script src="js/librerias.js"></script>
</body>
</html>
