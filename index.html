<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombre provisional · Tu bar de siempre, pero no como siempre</title>
    <meta name="description" content="Otra Ronda, bar de barrio en Madrid: cañas, tapas, vermut y buen rollo. Carta, novedades, horario y cómo llegar.">

    <!-- 1. Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">

    <!-- 2. CSS de librerías -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- 3. Nuestro CSS propio -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- 4. Tailwind desde el Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        /* Modo oscuro con la clase .dark en <html> (la pone js/interfaz.js) */
        @custom-variant dark (&:where(.dark, .dark *));

        /* 5. Sistema de diseño de Otra Ronda */
        @theme static {
            /* Colores de marca (no cambian en modo oscuro) */
            --color-guindilla: #ee3b2b;   /* rojo de la portada */
            --color-cana: #ffe04a;        /* amarillo cerveza */
            --color-azulejo: #2b44e8;     /* azul de la carta */
            --color-chicle: #f7a8d0;      /* rosa de la promo */
            --color-servilleta: #f4eee1;  /* crema de la ubicación */
            --color-tinta: #141414;       /* negro del texto */
            --color-noche: #17140f;       /* fondo del modo oscuro */
            --color-barra: #26221b;       /* superficies del modo oscuro */

            /* Colores por función: en modo oscuro los redefine css/styles.css */
            --color-fondo: #f4eee1;
            --color-texto: #141414;
            --color-borde: #141414;

            /* Tipografías */
            --font-rotulo: "Archivo Black", Impact, sans-serif;
            --font-texto: "DM Sans", system-ui, sans-serif;

            /* Radios y sombras de las tarjetas */
            --radius-tapa: 1.25rem;
            --shadow-pegada: 6px 6px 0 var(--color-tinta);
        }
    </style>
</head>
<body class="bg-fondo font-texto text-texto antialiased transition-colors duration-500">

   <!-- Enlace oculto para teclado: salta directamente al contenido -->
    <a href="#contenido" class="sr-only focus:not-sr-only">Saltar al contenido</a>

    <!-- CABECERA -->
    <header>
        <!-- Logo: vuelve al inicio -->
        <a href="#inicio" aria-label="Otra Ronda, ir al inicio">Otra Ronda<sup>®</sup></a>

        <div>
            <!-- Botón modo claro / oscuro (lo programa js/script.js) -->
            <button id="boton-tema" type="button" aria-pressed="false">Modo oscuro</button>

            <!-- Botón hamburguesa: solo se ve en móvil (md:hidden) -->
            <button id="boton-menu" type="button" aria-expanded="false" aria-controls="menu" class="md:hidden">Menú</button>
        </div>

        <!-- Navegación principal -->
        <nav aria-label="Principal">
            <!-- hidden: oculto en móvil hasta que el JS lo abra · md:flex: siempre visible en escritorio -->
            <ul id="menu" class="hidden md:flex">
                <li><a href="#bar" class="enlace-menu">El bar</a></li>
                <li><a href="#carta" class="enlace-menu">Carta</a></li>
                <li><a href="#novedades" class="enlace-menu">Novedades</a></li>
                <li><a href="#contacto" class="enlace-menu">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main id="contenido">
        <!-- 00 · PORTADA -->
        <section id="inicio"></section>

        <!-- 01 · EL BAR -->
        <section id="bar"></section>

        <!-- 02 · LA CARTA -->
        <section id="carta"></section>

        <!-- 03 · NOVEDADES -->
        <section id="novedades"></section>

        <!-- 04 · HORARIO Y CONTACTO -->
        <section id="contacto"></section>
    </main>

    <!-- FOOTER -->
    <footer>
    </footer>

    <!-- JS de librerías -->
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
